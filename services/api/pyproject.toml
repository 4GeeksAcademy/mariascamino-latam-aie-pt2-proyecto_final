[project]
name = "supplier-directory-api"
version = "0.1.0"
description = "Lightweight Storage API — HealthCore Supplier Directory"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tinydb",
    "pydantic[email]",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "database", "seed"]
packages = ["routes"]