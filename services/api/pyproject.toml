[project]
name = "supplier-directory-api"
version = "0.1.0"
description = "Lightweight Storage API — HealthCore Supplier Directory"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tinydb",
    "pydantic[email]",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sendgrid>=6.11.0",
]

[project.scripts]
seed = "seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "models", "database", "seed", "security", "auth_models", "password_reset", "email_service"]
packages = ["routes"]
